project:
  type: book
  output-dir: .
  post-render:
    - powershell -NoProfile -ExecutionPolicy Bypass -File _aufraeumen.ps1

lang: de
csl: https://www.zotero.org/styles/apa
bibliography: _src/Referenzen.bib
filters:
  - _verweise.lua
  - quarto

book:
  title: "Grundlagen der Testtheorie"
  subtitle: "Vorlesungsskript"
  author:
    - name: Dirk Ostwald
      affiliation: Otto-von-Guericke-Universität Magdeburg
  date: today
  output-file: Grundlagen-der-Testtheorie-2027
  chapters:
    - index.qmd
    - _src/_part_9/901-Psychologische-Tests.qmd
    - _src/_part_9/903-Modelle-der-klassischen-Testtheorie.qmd
    - _src/_part_9/904-Reliabilität-und-interne-Konsistenz.qmd
    - _src/_part_9/905-Exploratorische-Faktorenanalyse.qmd
    - Referenzen.qmd
  appendices:
    - _anhang/A-Wahrscheinlichkeitstheoretische-Ergaenzungen.qmd
    - _anhang/B-Ergaenzungen-aus-der-Linearen-Algebra.qmd


format:
  pdf:
    colorlinks: true
    linkcolor: darkblue
    urlcolor: darkblue
    citecolor: darkblue
    pdf-engine: xelatex
    documentclass: scrreprt
    toc-depth: 2
    papersize: a4
    # keep-tex verhindert Quarto-Cleanup im externen Quellprojekt.
    keep-tex: true
    latex-clean: true
    code-line-numbers: false
    latex-tinytex: false
    include-in-header:
      - _texheader.tex
      - _titelseite.tex
      - _abbildungen.tex

knitr:
  opts_chunk:
    crop: false
    cache: false
